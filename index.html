<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daleel · HIO prices and fees</title>
<meta name="description" content="Prices from HIO decree 460/2024 and insured radiology fees from decree 996/2020, with confidence and source for every amount.">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="favicon.svg" color="#2f2e2b">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header">
  <div class="header-inner">
    <a class="brand" href="./" id="brand-link" aria-label="Daleel">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M12 7.5l9.2 10.2a2.6 2.6 0 0 1-1.9 4.3H9.5" fill="none" stroke="var(--cream)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="25" width="14" height="1.8" rx=".9" fill="var(--gold)"/></svg>
      <span class="brand-text"><strong data-t="brand"></strong><small data-t="brandSub"></small></span>
    </a>
    <nav class="header-nav" aria-label="Main">
      <button class="nav-btn" id="open-rules" type="button" data-t="rules"></button>
      <button class="nav-btn" id="open-estimate" type="button"><span data-t="estimate"></span><span class="count-badge" id="estimate-count" hidden>0</span></button>
      <button class="nav-btn nav-lang" id="toggle-lang" type="button" data-t="lang"></button>
    </nav>
  </div>
</header>

<main id="main">
  <section id="hero-section" class="hero">
    <p class="hero-kicker" data-t="kicker"></p>
    <h1 class="hero-title" data-t="heroTitle"></h1>
    <p class="hero-sub" data-t="heroSub"></p>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" dir="auto" aria-label="Search">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <button id="search-clear" class="search-clear" type="button" aria-label="Clear" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </section>

  <section id="filter-section" class="filters" aria-label="Filters">
    <div class="field-row">
      <div class="field field-tier" id="tier-field"></div>
      <div class="field" id="src-field"></div>
      <div class="field" id="section-field"></div>
      <div class="field" id="conf-field"></div>
      <div class="field" id="sort-field"></div>
    </div>
    <div class="field-row more-filters" id="more-filters" hidden>
      <label class="field"><span class="field-label" data-t="minP"></span><input class="field-input" id="min-filter" type="number" inputmode="numeric" min="0" placeholder="0"></label>
      <label class="field"><span class="field-label" data-t="maxP"></span><input class="field-input" id="max-filter" type="number" inputmode="numeric" min="0" placeholder="—"></label>
      <div class="field" id="grade-field"></div>
      <label class="field field-check"><span class="field-label" data-t="amount"></span><span class="field-input check-box"><input id="priced-filter" type="checkbox"><span data-t="pricedOnly"></span></span></label>
    </div>
    <div class="filter-foot">
      <button class="link-btn" id="more-toggle" type="button"></button>
      <button class="link-btn" id="reset-filters" type="button" data-t="reset" hidden></button>
    </div>
  </section>

  <section id="results-section" class="results" aria-live="polite">
    <div class="results-meta" id="results-meta"></div>
    <ol class="result-list" id="result-list"></ol>
    <div id="result-sentinel" class="sentinel"></div>
    <div id="empty-state" class="empty-state" hidden></div>
  </section>
</main>

<footer class="site-footer">
  <p data-t="disclaimer"></p>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden></aside>
<aside class="sheet" id="estimate-sheet" role="dialog" aria-modal="true" aria-labelledby="estimate-title" hidden></aside>
<aside class="sheet sheet-wide" id="rules-sheet" role="dialog" aria-modal="true" aria-labelledby="rules-title" hidden></aside>

<script src="js/i18n.js" charset="utf-8"></script>
<script src="js/rules.js" charset="utf-8"></script>
<script src="js/engine.js" charset="utf-8"></script>
<script src="js/app.js" charset="utf-8"></script>
</body>
</html>
